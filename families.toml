tags = ["festival", "glow"]

[families.diwali.defaults]
"animation.windows_in" = "animation/cloud-puff"
"animation.windows_out" = "animation/cloud-puff"
"effects.border" = "border/diya-lights"
"effects.window" = "window/firelit-clouds"
"effects.cursor" = "cursor/festival-sparks"
"animation.workspaces" = "animation/rangoli-iris"

