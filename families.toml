# Catalogue-only family definitions. Members reference existing shader IDs.
# Defaults select standalone effects; companion overlays stay attached to borders.

[families.after-dark]
publish = true
name = "After Dark"
description = "Pumpkin vines, witchfire, haunted glass and fog for a Halloween desktop."
members = ["cursor/witchfire", "border/somethings-watching", "window/somethings-watching-overlay", "window/haunted-glass", "screen/midnight-fog", "animation/crescent-reveal", "animation/candle-snuff", "animation/witching-hour", "animation/spooky-move"]
tags = ["horror", "fire"]

[families.after-dark.defaults]
"effects.cursor" = "cursor/witchfire"
"effects.border" = "border/somethings-watching"
"effects.window" = "window/haunted-glass"
"effects.screen" = "screen/midnight-fog"
"animation.windows_in" = "animation/crescent-reveal"
"animation.windows_out" = "animation/candle-snuff"
"animation.workspaces" = "animation/witching-hour"
"animation.windows_move" = "animation/spooky-move"

[families.beach-surf]
publish = true
name = "Beach Surf"
description = "Coordinated surf and foam around windows and through their transitions, with a bioluminescent Pond Wake cursor trail."
members = ["animation/beach-surf-animation", "border/beach-surf", "window/beach-surf-overlay", "cursor/pond-wake"]
tags = ["water", "nature"]

[families.beach-surf.defaults]
"effects.cursor" = "cursor/pond-wake"
"effects.border" = "border/beach-surf"
"animation.windows_in" = "animation/beach-surf-animation"
"animation.windows_out" = "animation/beach-surf-animation"

[families.diwali]
publish = true
